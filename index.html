<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#667eea">
    <title>九九乘法大挑戰</title>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: "Segoe UI", "Noto Sans TC", sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px 0;
        }
        .window-box {
            background: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, .2);
            text-align: center;
            max-width: 460px;
            width: calc(100% - 32px);
        }
        h1 { color: #4a5568; margin: 0 0 5px; font-size: 28px; }
        .subtitle { color: #718096; font-size: 16px; margin-bottom: 25px; }
        .instructions {
            background-color: #f7fafc;
            border-left: 4px solid #5a67d8;
            padding: 15px;
            text-align: left;
            font-size: 14px;
            color: #4a5568;
            margin-bottom: 25px;
            border-radius: 0 10px 10px 0;
            line-height: 1.7;
        }
        .audio-control { text-align: right; margin-bottom: 10px; }
        .audio-btn {
            background: #edf2f7;
            border: none;
            padding: 7px 11px;
            border-radius: 7px;
            cursor: pointer;
            font-weight: bold;
            color: #4a5568;
        }
        .difficulty-container { display: flex; justify-content: space-between; margin: 15px 0; gap: 10px; }
        .diff-btn {
            flex: 1;
            padding: 9px 5px;
            font-size: 14px;
            border: 2px solid #cbd5e0;
            border-radius: 8px;
            background-color: #f7fafc;
            cursor: pointer;
            font-weight: bold;
            color: #4a5568;
        }
        .diff-btn.active { background-color: #5a67d8; color: white; border-color: #4c51bf; }
        .diff-btn:disabled { cursor: not-allowed; }
        .stats { display: flex; justify-content: space-between; margin-bottom: 10px; font-size: 16px; font-weight: bold; color: #4a5568; align-items: center; gap: 6px; }
        .hp-display { color: #e53e3e; font-size: 19px; letter-spacing: 1px; white-space: nowrap; }
        .highscore-board { background-color: #edf2f7; padding: 9px; border-radius: 10px; font-size: 15px; font-weight: bold; color: #2b6cb0; margin-bottom: 20px; }
        .question { font-size: clamp(36px, 10vw, 48px); font-weight: bold; color: #5a67d8; margin: 20px 0; }
        input {
            font-size: 24px;
            width: 150px;
            padding: 10px;
            text-align: center;
            border: 3px solid #cbd5e0;
            border-radius: 10px;
            outline: none;
        }
        input:focus { border-color: #5a67d8; }
        input:disabled { background: #f7fafc; }
        .action-btn {
            font-size: 20px;
            padding: 12px 25px;
            background-color: #48bb78;
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            margin-top: 15px;
            width: 100%;
            font-weight: bold;
        }
        .action-btn:hover { background-color: #38a169; }
        .menu-btn { background-color: #5a67d8; }
        .menu-btn:hover { background-color: #4c51bf; }
        .back-btn {
            background-color: #e2e8f0;
            color: #4a5568;
            margin-top: 15px;
            font-size: 16px;
            padding: 9px;
            width: 100%;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
        }
        .back-btn:hover { background-color: #cbd5e0; }
        .message { font-size: 18px; font-weight: bold; margin-top: 15px; min-height: 30px; line-height: 1.5; }
        .correct { color: #38a169; }
        .wrong { color: #e53e3e; }
        .hidden { display: none !important; }
        .review-box {
            margin-top: 20px;
            padding: 15px;
            background-color: #fffaf0;
            border: 2px dashed #f6ad55;
            border-radius: 12px;
            text-align: left;
            max-height: 180px;
            overflow-y: auto;
        }
        .review-title { font-weight: bold; color: #dd6b20; margin-bottom: 8px; font-size: 16px; }
        .review-item { font-size: 14px; color: #4a5568; margin-bottom: 4px; padding-bottom: 4px; border-bottom: 1px dotted #feebc8; }
        @media (max-width: 380px) {
            .window-box { padding: 22px 16px; }
            h1 { font-size: 24px; }
            .diff-btn { font-size: 12px; }
            .stats { font-size: 14px; }
        }
    </style>

<body>
    <main>
        <section id="menu-container" class="window-box">
            <h1>九九乘法大挑戰</h1>
            <div class="subtitle">鍛鍊你的大腦速算極限！</div>
            <div class="instructions">
                <strong>遊戲規則說明：</strong><br>
                1. 挑戰時間為 30 秒，答對一題獲得 <strong>+10 分</strong>。<br>
                2. 你有 3 顆心，答錯會<strong>扣除 1 顆心</strong>；心心扣光遊戲提早結束。<br>
                3. 輸入答案後按 <strong>Enter 鍵</strong>即可快速提交。<br>
                4. 結束後會提供<strong>錯題筆記</strong>，幫你複習盲點。
            </div>
            <button class="action-btn menu-btn" type="button" id="enter-game-btn">進入遊戲</button>
        </section>

        <section id="game-container" class="window-box hidden" aria-label="九九乘法遊戲">
            <h1>九九乘法大挑戰</h1>
            <div class="audio-control">
                <button id="audio-toggle" class="audio-btn" type="button" aria-pressed="false">音效：關</button>
            </div>
            <div class="difficulty-container" id="diff-box" aria-label="選擇難度">
                <button class="diff-btn active" type="button" data-difficulty="easy">簡單 (2–9)</button>
                <button class="diff-btn" type="button" data-difficulty="medium">中等 (11–19)</button>
                <button class="diff-btn" type="button" data-difficulty="hard">困難 (11–99)</button>
            </div>
            <div class="stats">
                <div>分數：<span id="score">0</span></div>
                <div class="hp-display" id="hp-box" aria-label="剩餘 3 顆心">❤️❤️❤️</div>
                <div>時間：<span id="timer">30</span> 秒</div>
            </div>
            <div class="highscore-board">
                🏆 <span id="diff-label">簡單</span>模式最高紀錄：<span id="high-score">0</span> 分
            </div>
            <div id="game-box">
                <div class="question" id="question" aria-live="polite">選擇難度後點擊開始</div>
                <form id="answer-form">
                    <input type="number" id="answer" placeholder="答案" aria-label="輸入答案" inputmode="numeric" disabled>
                    <button id="btn" class="action-btn" type="submit">開始遊戲</button>
                </form>
                <div class="message" id="message" aria-live="polite"></div>
                <div id="review-area" class="review-box hidden"></div>
            </div>
            <button id="back-menu-btn" class="back-btn hidden" type="button">返回主選單</button>
        </section>
    </main>

    <script>
        "use strict";

        const GAME_LENGTH_SECONDS = 30;
        const STARTING_HEARTS = 3;
        const POINTS_PER_CORRECT_ANSWER = 10;
        const difficultyLabels = { easy: "簡單", medium: "中等", hard: "困難" };
        const storageKeys = { easy: "mult_high_easy", medium: "mult_high_medium", hard: "mult_high_hard" };

        let score = 0;
        let timeLeft = GAME_LENGTH_SECONDS;
        let num1 = 0;
        let num2 = 0;
        let correctAnswer = 0;
        let gameActive = false;
        let timerInterval = null;
        let difficulty = "easy";
        let soundEnabled = false;
        let audioContext = null;
        let hp = STARTING_HEARTS;
        let wrongQuestions = [];

        function readHighScore(level) {
            try {
                return Number.parseInt(localStorage.getItem(storageKeys[level]), 10) || 0;
            } catch (error) {
                return 0;
            }
        }

        const highScores = {
            easy: readHighScore("easy"),
            medium: readHighScore("medium"),
            hard: readHighScore("hard")
        };

        const menuContainer = document.getElementById("menu-container");
        const gameContainer = document.getElementById("game-container");
        const questionEl = document.getElementById("question");
        const answerEl = document.getElementById("answer");
        const answerForm = document.getElementById("answer-form");
        const btnEl = document.getElementById("btn");
        const scoreEl = document.getElementById("score");
        const timerEl = document.getElementById("timer");
        const hpEl = document.getElementById("hp-box");
        const highScoreEl = document.getElementById("high-score");
        const diffLabelEl = document.getElementById("diff-label");
        const messageEl = document.getElementById("message");
        const diffButtons = document.querySelectorAll(".diff-btn");
        const audioToggleBtn = document.getElementById("audio-toggle");
        const backMenuBtn = document.getElementById("back-menu-btn");
        const reviewArea = document.getElementById("review-area");
        const diffBox = document.getElementById("diff-box");

        highScoreEl.textContent = highScores[difficulty];

        document.getElementById("enter-game-btn").addEventListener("click", enterGame);
        document.getElementById("back-menu-btn").addEventListener("click", returnToMenu);
        document.getElementById("audio-toggle").addEventListener("click", toggleSound);
        diffButtons.forEach((button) => {
            button.addEventListener("click", () => handleDiff(button.dataset.difficulty));
        });
        answerForm.addEventListener("submit", (event) => {
            event.preventDefault();
            if (gameActive) checkAnswer();
            else startGame();
        });

        function enterGame() {
            menuContainer.classList.add("hidden");
            gameContainer.classList.remove("hidden");
            updateHighScoreDisplay();
        }

        function returnToMenu() {
            if (gameActive) return;
            gameContainer.classList.add("hidden");
            menuContainer.classList.remove("hidden");
        }

        function toggleSound() {
            soundEnabled = !soundEnabled;
            audioToggleBtn.textContent = soundEnabled ? "音效：開" : "音效：關";
            audioToggleBtn.setAttribute("aria-pressed", String(soundEnabled));
            if (soundEnabled && !audioContext) {
                const AudioContextClass = window.AudioContext || window.webkitAudioContext;
                if (AudioContextClass) audioContext = new AudioContextClass();
            }
            if (soundEnabled && audioContext && audioContext.state === "suspended") {
                audioContext.resume().catch(() => {});
            }
        }

        function playTone(frequency, duration, type, volume) {
            if (!soundEnabled || !audioContext) return;
            try {
                const oscillator = audioContext.createOscillator();
                const gain = audioContext.createGain();
                const now = audioContext.currentTime;
                oscillator.type = type || "sine";
                oscillator.frequency.setValueAtTime(frequency, now);
                gain.gain.setValueAtTime(volume || 0.08, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + duration);
                oscillator.connect(gain);
                gain.connect(audioContext.destination);
                oscillator.start(now);
                oscillator.stop(now + duration);
            } catch (error) {
                // 若瀏覽器不支援音效，不影響遊戲進行。
            }
        }

        function updateHighScoreDisplay() {
            diffLabelEl.textContent = difficultyLabels[difficulty];
            highScoreEl.textContent = highScores[difficulty];
        }

        function handleDiff(level) {
            if (gameActive || !difficultyLabels[level]) return;
            difficulty = level;
            diffButtons.forEach((button) => {
                button.classList.toggle("active", button.dataset.difficulty === level);
            });
            updateHighScoreDisplay();
            questionEl.textContent = "準備好了嗎？按下開始遊戲！";
        }

        function startGame() {
            if (gameActive) return;
            score = 0;
            timeLeft = GAME_LENGTH_SECONDS;
            hp = STARTING_HEARTS;
            wrongQuestions = [];
            gameActive = true;
            scoreEl.textContent = score;
            timerEl.textContent = timeLeft;
            updateHearts();
            messageEl.textContent = "";
            messageEl.className = "message";
            answerEl.disabled = false;
            answerEl.value = "";
            btnEl.textContent = "提交答案";
            backMenuBtn.classList.add("hidden");
            reviewArea.classList.add("hidden");
            reviewArea.replaceChildren();
            diffBox.style.pointerEvents = "none";
            diffBox.style.opacity = "0.5";
            generateQuestion();
            answerEl.focus();

            timerInterval = window.setInterval(() => {
                if (!gameActive) return;
                timeLeft -= 1;
                timerEl.textContent = timeLeft;
                if (timeLeft <= 0) endGame("時間到！");
            }, 1000);
        }

        function generateQuestion() {
            if (difficulty === "easy") {
                num1 = Math.floor(Math.random() * 8) + 2;
                num2 = Math.floor(Math.random() * 8) + 2;
            } else if (difficulty === "medium") {
                num1 = Math.floor(Math.random() * 9) + 11;
                num2 = Math.floor(Math.random() * 9) + 11;
            } else {
                num1 = Math.floor(Math.random() * 89) + 11;
                num2 = Math.floor(Math.random() * 89) + 11;
            }
            correctAnswer = num1 * num2;
            questionEl.textContent = `${num1} × ${num2} = ?`;
            answerEl.value = "";
        }

        function updateHearts() {
            hpEl.textContent = "❤️".repeat(Math.max(0, hp)) || "🖤";
            hpEl.setAttribute("aria-label", `剩餘 ${hp} 顆心`);
        }

        function checkAnswer() {
            if (!gameActive) return;
            const rawAnswer = answerEl.value.trim();
            const userAnswer = rawAnswer === "" ? Number.NaN : Number(rawAnswer);

            if (userAnswer === correctAnswer) {
                score += POINTS_PER_CORRECT_ANSWER;
                scoreEl.textContent = score;
                messageEl.className = "message correct";
                messageEl.textContent = `答對了！(+${POINTS_PER_CORRECT_ANSWER})`;
                playTone(660, 0.12, "sine", 0.08);
                window.setTimeout(() => playTone(880, 0.16, "sine", 0.07), 80);
                generateQuestion();
            } else {
                hp -= 1;
                updateHearts();
                wrongQuestions.push({
                    q: `${num1} × ${num2}`,
                    correct: correctAnswer,
                    user: Number.isNaN(userAnswer) ? "未填" : userAnswer
                });
                messageEl.className = "message wrong";
                messageEl.textContent = "答錯囉！扣除 1 顆心";
                playTone(220, 0.25, "triangle", 0.09);
                if (hp <= 0) {
                    endGame("生命值耗盡！");
                    return;
                }
                generateQuestion();
            }
            answerEl.focus();
        }

        function endGame(reason) {
            if (!gameActive) return;
            gameActive = false;
            window.clearInterval(timerInterval);
            timerInterval = null;
            answerEl.disabled = true;
            questionEl.textContent = reason;
            let resultText = `遊戲結束！最終得分：${score} 分！`;

            if (score > highScores[difficulty]) {
                highScores[difficulty] = score;
                try {
                    localStorage.setItem(storageKeys[difficulty], String(score));
                } catch (error) {
                    // 瀏覽器封鎖本機儲存時，仍保留本次頁面中的紀錄。
                }
                highScoreEl.textContent = score;
                resultText += `\n恭喜打破${difficultyLabels[difficulty]}模式紀錄！`;
            }

            messageEl.className = "message correct";
            messageEl.textContent = resultText;
            btnEl.textContent = "再玩一次";
            backMenuBtn.classList.remove("hidden");
            diffBox.style.pointerEvents = "auto";
            diffBox.style.opacity = "1";

            if (wrongQuestions.length > 0) {
                const title = document.createElement("div");
                title.className = "review-title";
                title.textContent = "錯題複習筆記：";
                reviewArea.replaceChildren(title);
                wrongQuestions.forEach((item) => {
                    const row = document.createElement("div");
                    row.className = "review-item";
                    row.textContent = `× ${item.q} = ${item.correct}（你輸入了 ${item.user}）`;
                    reviewArea.appendChild(row);
                });
                reviewArea.classList.remove("hidden");
            }
        }
    </script>
