<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>九九乘法大挑戰 🎮</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .game-container {
            background: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            text-align: center;
            max-width: 400px;
            width: 90%;
        }
        h1 { color: #4a5568; margin-bottom: 10px; font-size: 28px; }
        .difficulty-container {
            display: flex;
            justify-content: space-between;
            margin: 15px 0;
            gap: 10px;
        }
        .diff-btn {
            flex: 1;
            padding: 8px;
            font-size: 14px;
            border: 2px solid #cbd5e0;
            border-radius: 8px;
            background-color: #f7fafc;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.2s;
        }
        .diff-btn.active {
            background-color: #5a67d8;
            color: white;
            border-color: #4c51bf;
        }
        .stats {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
            font-size: 18px;
            font-weight: bold;
            color: #4a5568;
        }
        .highscore-board {
            background-color: #edf2f7;
            padding: 8px;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            color: #2b6cb0;
            margin-bottom: 20px;
            transition: all 0.3s;
        }
        .question {
            font-size: 48px;
            font-weight: bold;
            color: #5a67d8;
            margin: 20px 0;
            animation: bounce 0.5s ease;
        }
        input {
            font-size: 24px;
            width: 120px;
            padding: 10px;
            text-align: center;
            border: 3px solid #cbd5e0;
            border-radius: 10px;
            outline: none;
            transition: border-color 0.2s;
        }
        input:focus { border-color: #5a67d8; }
        .action-btn {
            font-size: 20px;
            padding: 10px 25px;
            background-color: #48bb78;
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            margin-top: 15px;
            width: 100%;
            font-weight: bold;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .action-btn:hover { background-color: #38a169; }
        .message {
            font-size: 20px;
            font-weight: bold;
            margin-top: 15px;
            min-height: 30px;
        }
        .correct { color: #38a169; }
        .wrong { color: #e53e3e; }
        @keyframes bounce {
            0% { transform: scale(0.8); }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }
    </style>
</head>
<body>

<div class="game-container">
    <h1>九九乘法大挑戰 🎮</h1>
    
    <!-- 難度選擇按鈕 -->
    <div class="difficulty-container" id="diff-box">
        <button class="diff-btn active" onclick="setDifficulty('easy', event)">簡單 (2-9)</button>
        <button class="diff-btn" onclick="setDifficulty('medium', event)">中等 (11-19)</button>
        <button class="diff-btn" onclick="setDifficulty('hard', event)">困難 (11-99)</button>
    </div>

    <!-- 即時分數與時間 -->
    <div class="stats">
        <div>分數: <span id="score">0</span></div>
        <div>時間: <span id="timer">30</span> 秒</div>
    </div>

    <!-- 個人最高分紀錄看板 -->
    <div class="highscore-board">
        🏆 <span id="diff-label">簡單</span>模式最高紀錄: <span id="high-score">0</span> 分
    </div>
    
    <div id="game-box">
        <div class="question" id="question">選擇難度後點擊開始</div>
        <input type="number" id="answer" placeholder="答案" disabled>
        <button id="btn" class="action-btn" onclick="startGame()">開始遊戲</button>
        <div class="message" id="message"></div>
    </div>
</div>

<script>
    let score = 0;
    let timeLeft = 30;
    let num1, num2, correctAnswer;
    let gameActive = false;
    let timerInterval;
    let difficulty = 'easy'; // 預設簡單
    
    // 用一個物件管理三種難度的歷史最高分
    let highScores = {
        easy: parseInt(localStorage.getItem('mult_high_easy')) || 0,
        medium: parseInt(localStorage.getItem('mult_high_medium')) || 0,
        hard: parseInt(localStorage.getItem('mult_high_hard')) || 0
    };

    const questionEl = document.getElementById('question');
    const answerEl = document.getElementById('answer');
    const btnEl = document.getElementById('btn');
    const scoreEl = document.getElementById('score');
    const timerEl = document.getElementById('timer');
    const highScoreEl = document.getElementById('high-score');
    const diffLabelEl = document.getElementById('diff-label');
    const messageEl = document.getElementById('message');
    const diffButtons = document.querySelectorAll('.diff-btn');

    // 網頁初始時載入預設（簡單）模式的最高分
    updateHighScoreDisplay();

    answerEl.addEventListener('keyup', function(event) {
        if (event.key === 'Enter') {
            checkAnswer();
        }
    });

    // 根據難度更新看板文字和分數
    function updateHighScoreDisplay() {
        const labels = { easy: '簡單', medium: '中等', hard: '困難' };
        diffLabelEl.innerText = labels[difficulty];
        highScoreEl.innerText = highScores[difficulty];
    }

    function setDifficulty(level, event) {
        if (gameActive) return; 
        difficulty = level;
        
        diffButtons.forEach(btn => btn.classList.remove('active'));
        event.target.classList.add('active');
        
        // 切換難度時，即時切換顯示該難度的最高紀錄
        updateHighScoreDisplay();
    }

    function startGame() {
        score = 0;
        timeLeft = 30;
        gameActive = true;
        scoreEl.innerText = score;
        timerEl.innerText = timeLeft;
        messageEl.innerText = '';
        answerEl.disabled = false;
        btnEl.innerText = '提交答案';
        btnEl.setAttribute('onclick', 'checkAnswer()');
        
        document.getElementById('diff-box').style.pointerEvents = 'none';
        document.getElementById('diff-box').style.opacity = '0.5';
        
        generateQuestion();
        answerEl.focus();

        timerInterval = setInterval(() => {
            timeLeft--;
            timerEl.innerText = timeLeft;
            if (timeLeft <= 0) {
                endGame();
            }
        }, 1000);
    }

    function generateQuestion() {
        if (difficulty === 'easy') {
            num1 = Math.floor(Math.random() * 8) + 2;
            num2 = Math.floor(Math.random() * 8) + 2;
        } else if (difficulty === 'medium') {
            num1 = Math.floor(Math.random() * 9) + 11;
            num2 = Math.floor(Math.random() * 9) + 11;
        } else if (difficulty === 'hard') {
            num1 = Math.floor(Math.random() * 89) + 11;
            num2 = Math.floor(Math.random() * 89) + 11;
        }
        
        correctAnswer = num1 * num2;
        questionEl.innerText = `${num1} × ${num2} = ?`;
        answerEl.value = '';
    }

    function checkAnswer() {
        if (!gameActive) return;
        
        const userAnswer = parseInt(answerEl.value);
        
        if (userAnswer === correctAnswer) {
            score += 10;
            scoreEl.innerText = score;
            messageEl.className = 'message correct';
            messageEl.innerText = '答對了！🎉 (+10)';
        } else {
            score -= 5; 
            scoreEl.innerText = score;
            messageEl.className = 'message wrong';
            messageEl.innerText = `答錯囉 ❌ (-5) 答案是 ${correctAnswer}`;
        }
        
        generateQuestion();
        answerEl.focus();
    }

    function endGame() {
        gameActive = false;
        clearInterval(timerInterval);
        answerEl.disabled = true;
        questionEl.innerText = '時間到！⌛';
        
        let msgText = `遊戲結束！最終得分：${score} 分！`;
        
        // 檢查是否打破「當前難度」的最高紀錄
        if (score > highScores[difficulty]) {
            highScores[difficulty] = score;
            
            // 根據不同難度儲存到獨立的快取中
            const storageKeys = { easy: 'mult_high_easy', medium: 'mult_high_medium', hard: 'mult_high_hard' };
            localStorage.setItem(storageKeys[difficulty], score);
            
            highScoreEl.innerText = score;
            msgText += `<br><span style="color: #ecc94b; font-size: 22px;">👑 恭喜打破${diffLabelEl.innerText}模式紀錄！</span>`;
        }

        messageEl.className = 'message';
        messageEl.innerHTML = msgText;
        
        btnEl.innerText = '再玩一次';
        btnEl.setAttribute('onclick', 'startGame()');
        
        document.getElementById('diff-box').style.pointerEvents = 'auto';
        document.getElementById('diff-box').style.opacity = '1';
    }
</script>

</body>
</html>
