<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>九九乘法大挑戰 🎮</title>
    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px 0;
            box-sizing: border-box;
        }
        .window-box {
            background: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            text-align: center;
            max-width: 420px;
            width: 90%;
            transition: all 0.3s ease;
        }
        h1 { color: #4a5568; margin-bottom: 5px; font-size: 28px; }
        .subtitle { color: #718096; font-size: 16px; margin-bottom: 25px; }
        .instructions {
            background-color: #f7fafc;
            border-left: 4px solid #5a67d8;
            padding: 15px;
            text-align: left;
            font-size: 14px;
            color: #4a5568;
            margin-bottom: 25px;
            border-radius: 0 10px 10px 0;
            line-height: 1.6;
        }
        .audio-control { text-align: right; margin-bottom: 10px; }
        .audio-btn { background: #edf2f7; border: none; padding: 5px 10px; border-radius: 5px; cursor: pointer; font-weight: bold; }
        .difficulty-container { display: flex; justify-content: space-between; margin: 15px 0; gap: 10px; }
        .diff-btn { flex: 1; padding: 8px; font-size: 14px; border: 2px solid #cbd5e0; border-radius: 8px; background-color: #f7fafc; cursor: pointer; font-weight: bold; }
        .diff-btn.active { background-color: #5a67d8; color: white; border-color: #4c51bf; }
        
        /* 遊戲狀態與血量欄 */
        .stats { display: flex; justify-content: space-between; margin-bottom: 10px; font-size: 18px; font-weight: bold; color: #4a5568; align-items: center; }
        .hp-display { color: #e53e3e; font-size: 20px; letter-spacing: 2px; }
        .highscore-board { background-color: #edf2f7; padding: 8px; border-radius: 10px; font-size: 16px; font-weight: bold; color: #2b6cb0; margin-bottom: 20px; }
        
        .question { font-size: 48px; font-weight: bold; color: #5a67d8; margin: 20px 0; }
        input { font-size: 24px; width: 120px; padding: 10px; text-align: center; border: 3px solid #cbd5e0; border-radius: 10px; outline: none; }
        input:focus { border-color: #5a67d8; }
        .action-btn { font-size: 20px; padding: 12px 25px; background-color: #48bb78; color: white; border: none; border-radius: 10px; cursor: pointer; margin-top: 15px; width: 100%; font-weight: bold; box-shadow: 0 4px 6px rgba(0,0,0,0.1); transition: background 0.2s; }
        .action-btn:hover { background-color: #38a169; }
        .menu-btn { background-color: #5a67d8; }
        .menu-btn:hover { background-color: #4c51bf; }
        .back-btn { background-color: #e2e8f0; color: #4a5568; box-shadow: none; margin-top: 15px; font-size: 16px; padding: 8px; }
        .back-btn:hover { background-color: #cbd5e0; }
        
        .message { font-size: 20px; font-weight: bold; margin-top: 15px; min-height: 30px; line-height: 1.5; }
        .correct { color: #38a169; }
        .wrong { color: #e53e3e; }
        .hidden { display: none !important; }

        /* 錯題筆記樣式 */
        .review-box {
            margin-top: 20px;
            padding: 15px;
            background-color: #fffaf0;
            border: 2px dashed #f6ad55;
            border-radius: 12px;
            text-align: left;
            max-height: 180px;
            overflow-y: auto;
        }
        .review-title { font-weight: bold; color: #dd6b20; margin-bottom: 8px; font-size: 16px; display: flex; align-items: center; gap: 5px; }
        .review-item { font-size: 14px; color: #4a5568; margin-bottom: 4px; padding-bottom: 4px; border-bottom: 1px dotted #feebc8; }
    </style>
</head>
<body>

<audio id="bgm" src="https://mixkit.co" loop></audio>
<audio id="sound-correct" src="https://wikimedia.org"></audio>
<audio id="sound-wrong" src="https://wikimedia.org"></audio>

<!-- 1. 遊戲主選單畫面 -->
<div id="menu-container" class="window-box">
    <h1>九九乘法大挑戰 🎮</h1>
    <div class="subtitle">鍛鍊你的大腦速算極限！</div>
    
    <div class="instructions">
        <strong>📜 遊戲規則說明：</strong><br>
        1. 挑戰時間為 30 秒，答對一題獲得 <strong>+10 分</strong>。<br>
        2. ❤️ <strong>生命值系統</strong>：你擁有 3 顆心，答錯不扣分，但會<strong>扣除 1 顆心</strong>！心心扣光遊戲提早結束！<br>
        3. ⌨️ 輸入答案後直接按 <strong>Enter 鍵</strong> 就能快速提交。<br>
        4. 📝 結束後會提供<strong>錯題筆記</strong>，幫你複習盲點！
    </div>

    <button class="action-btn menu-btn" onclick="enterGame()">進入遊戲 🚀</button>
</div>

<!-- 2. 遊戲主體畫面 -->
<div id="game-container" class="window-box hidden">
    <h1>九九乘法大挑戰 🎮</h1>
    
    <div class="audio-control">
        <button id="audio-toggle" class="audio-btn" onclick="toggleBGM()">📁 音樂：關</button>
    </div>
    
    <div class="difficulty-container" id="diff-box">
        <button class="diff-btn active" onclick="setDifficulty('easy', event)">簡單 (2-9)</button>
        <button class="diff-btn" onclick="setDifficulty('medium', event)">中等 (11-19)</button>
        <button class="diff-btn" onclick="setDifficulty('hard', event)">困難 (11-99)</button>
    </div>

    <div class="stats">
        <div>分數: <span id="score">0</span></div>
        <div class="hp-display" id="hp-box">❤️❤️❤️</div>
        <div>時間: <span id="timer">30</span> 秒</div>
    </div>

    <div class="highscore-board">
        🏆 <span id="diff-label">簡單</span>模式最高紀錄: <span id="high-score">0</span> 分
    </div>
    
    <div id="game-box">
        <div class="question" id="question">選擇難度後點擊開始</div>
        <input type="number" id="answer" placeholder="答案" disabled>
        <button id="btn" class="action-btn" onclick="startGame()">開始遊戲</button>
        <div class="message" id="message"></div>
        
        <!-- 錯題筆記渲染區域 -->
        <div id="review-area" class="review-box hidden"></div>
    </div>

    <button id="back-menu-btn" class="action-btn back-btn" onclick="returnToMenu()">返回主選單 🏠</button>
</div>

<script>
    var score = 0;
    var timeLeft = 30;
    var num1, num2, correctAnswer;
    var gameActive = false;
    var timerInterval;
    var difficulty = 'easy'; 
    var bgmPlaying = false;
    
    var hp = 3; // 初始生命值
    var wrongQuestions = []; // 儲存錯題紀錄的陣列

    var highScores = {
        easy: parseInt(localStorage.getItem('mult_high_easy')) || 0,
        medium: parseInt(localStorage.getItem('mult_high_medium')) || 0,
        hard: parseInt(localStorage.getItem('mult_high_hard')) || 0
    };

    var bgm = document.getElementById('bgm');
    var soundCorrect = document.getElementById('sound-correct');
    var soundWrong = document.getElementById('sound-wrong');
    bgm.volume = 0.2;

    var menuContainer = document.getElementById('menu-container');
    var gameContainer = document.getElementById('game-container');
    var questionEl = document.getElementById('question');
    var answerEl = document.getElementById('answer');
    var btnEl = document.getElementById('btn');
    var scoreEl = document.getElementById('score');
    var timerEl = document.getElementById('timer');
    var hpEl = document.getElementById('hp-box');
    var highScoreEl = document.getElementById('high-score');
    var diffLabelEl = document.getElementById('diff-label');
    var messageEl = document.getElementById('message');
    var diffButtons = document.querySelectorAll('.diff-btn');
    var audioToggleBtn = document.getElementById('audio-toggle');
    var backMenuBtn = document.getElementById('back-menu-btn');
    var reviewArea = document.getElementById('review-area');

    highScoreEl.innerText = highScores[difficulty];

    answerEl.addEventListener('keyup', function(event) {
        if (event.key === 'Enter') {
            checkAnswer();
        }
    });

    function enterGame() {
        menuContainer.classList.add('hidden');
        gameContainer.classList.remove('hidden');
        updateHighScoreDisplay();
    }

    function returnToMenu() {
        if (gameActive) return; 
        gameContainer.classList.add('hidden');
        menuContainer.classList.remove('hidden');
    }

    function toggleBGM() {
        if (bgmPlaying) {
            bgm.pause();
            audioToggleBtn.innerText = '📁 音樂：關';
            bgmPlaying = false;
        } else {
            bgm.play().catch(function(e){});
            audioToggleBtn.innerText = '🎵 音樂：開';
            bgmPlaying = true;
        }
    }

    function updateHighScoreDisplay() {
        var labels = { easy: '簡單', medium: '中等', hard: '困難' };
        diffLabelEl.innerText = labels[difficulty];
        highScoreEl.innerText = highScores[difficulty];
    }

    function setDifficulty(level, event) {
        if (gameActive) return; 
        difficulty = level;
        diffButtons.forEach(function(btn) { btn.classList.remove('active'); });
        event.target.classList.add('active');
        updateHighScoreDisplay();
    }

    function startGame() {
        score = 0;
        timeLeft = 30;
        hp = 3; // 重設血量
        wrongQuestions = []; // 清空上一次的錯題
        gameActive = true;
        
        scoreEl.innerText = score;
        timerEl.innerText = timeLeft;
        hpEl.innerText = '❤️❤️❤️';
        messageEl.innerText = '';
        answerEl.disabled = false;
        btnEl.innerText = '提交答案';
        btnEl.setAttribute('onclick', 'checkAnswer()');
        
        backMenuBtn.classList.add('hidden');
        reviewArea.classList.add('hidden'); // 隱藏錯題筆記
        
document.getElementById('diff-box').style.pointerEvents = 'none';
document.getElementById('diff-box').style.opacity = '0.5';
if (bgmPlaying) {
bgm.play().catch(function(e){});
}
generateQuestion();
setTimeout(function() {
answerEl.focus();
}, 50);
timerInterval = setInterval(function() {
timeLeft--;
timerEl.innerText = timeLeft;
if (timeLeft <= 0) {
endGame('時間到！⌛');
}
}, 1000);
}
function generateQuestion() {
if (difficulty === 'easy') {
num1 = Math.floor(Math.random() * 8) + 2;
num2 = Math.floor(Math.random() * 8) + 2;
} else if (difficulty === 'medium') {
num1 = Math.floor(Math.random() * 9) + 11;
num2 = Math.floor(Math.random() * 9) + 11;
} else if (difficulty === 'hard') {
num1 = Math.floor(Math.random() * 89) + 11;
num2 = Math.floor(Math.random() * 89) + 11;
}
correctAnswer = num1 * num2;
questionEl.innerText = num1 + ' × ' + num2 + ' = ?';
answerEl.value = '';
}
function checkAnswer() {
if (!gameActive) return;
var userAnswer = parseInt(answerEl.value);
if (userAnswer === correctAnswer) {
score += 10;
scoreEl.innerText = score;
messageEl.className = 'message correct';
messageEl.innerText = '答對了！🎉 (+10)';
soundCorrect.currentTime = 0;
soundCorrect.play().catch(function(e){});
generateQuestion();
} else {
// 答錯：扣除一顆心，並將錯誤紀錄存進陣列
hp--;
var hearts = '';
for(var i=0; i<hp; i++) { hearts += '❤️'; }
hpEl.innerText = hearts || '🖤'; // 沒血顯示黑心
// 把這題的詳細資訊存起來
wrongQuestions.push({
q: num1 + ' × ' + num2,
correct: correctAnswer,
user: isNaN(userAnswer) ? '未填' : userAnswer
});
messageEl.className = 'message wrong';
messageEl.innerText = '答錯囉！💔 扣除 1 顆心';
soundWrong.currentTime = 0;
soundWrong.play().catch(function(e){});
if (hp <= 0) {
endGame('生命值耗盡！💀');
} else {
generateQuestion();
}
}
answerEl.focus();
}
function endGame(reason) {
gameActive = false;
clearInterval(timerInterval);
answerEl.disabled = true;
questionEl.innerText = reason;
bgm.pause();
bgm.currentTime = 0;
var msgText = '遊戲結束！最終得分：' + score + ' 分！';
if (score > highScores[difficulty]) {
highScores[difficulty] = score;
var storageKeys = { easy: 'mult_high_easy', medium: 'mult_high_medium', hard: 'mult_high_hard' };
localStorage.setItem(storageKeys[difficulty], score);
highScoreEl.innerText = score;
msgText += '
👑 恭喜打破' + diffLabelEl.innerText + '模式紀錄！';
}
messageEl.innerHTML = msgText;
btnEl.innerText = '再玩一次';
btnEl.setAttribute('onclick', 'startGame()');
backMenuBtn.classList.remove('hidden');
document.getElementById('diff-box').style.pointerEvents = 'auto';
document.getElementById('diff-box').style.opacity = '1';
// 🧠 錯題筆記渲染邏輯
if (wrongQuestions.length > 0) {
var reviewHTML = '📝 錯題複習筆記：';
for (var j = 0; j < wrongQuestions.length; j++) {
reviewHTML += '❌ ' + wrongQuestions[j].q + ' = ' + wrongQuestions[j].correct + ' (你輸入了 ' + wrongQuestions[j].user + ')';
}
reviewArea.innerHTML = reviewHTML;
reviewArea.classList.remove('hidden'); // 顯示筆記框
}
</script>

</body>
</html>
